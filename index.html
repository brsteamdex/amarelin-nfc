<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pokémon Yellow</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      touch-action: none; /* Evita zoom e rolagem acidental no toque */
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <script type="text/javascript">
    EJS_player = '#game-container';
    EJS_core = 'gb'; 
    EJS_gameUrl = 'Amarelin.gb'; // Garanta que o nome do arquivo da ROM está exato
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    
    // Configurações focadas em dispositivos móveis
    EJS_startOnLoaded = false; // Exige toque inicial para ativar áudio/controles no mobile
    EJS_color = '#eab308';
  </script>
  
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>

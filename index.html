<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pokémon Yellow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Container do Jogo (Ocupa a tela inteira desde o início) */
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Tela de Entrada (Sobreposta ao container do jogo) */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      background: radial-gradient(circle, #2a2a2a 0%, #000000 100%);
    }

    .title {
      font-size: 1.8rem;
      font-weight: bold;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #a1a1aa;
      margin-bottom: 30px;
    }

    .btn-play {
      background-color: #facc15;
      color: #000;
      border: none;
      padding: 16px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
      transition: transform 0.2s, background-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-play:active {
      transform: scale(0.95);
      background-color: #eab308;
    }
  </style>
</head>
<body>

  <!-- Tela Inicial / Overlay NFC -->
  <div id="start-screen">
    <div class="title">POKÉMON YELLOW</div>
    <div class="subtitle">Special Pikachu Edition</div>
    <button class="btn-play" id="btn-start" onclick="startGame()">▶ JOGAR AGORA</button>
  </div>

  <!-- Container do Emulador -->
  <div id="game-container"></div>

  <script type="text/javascript">
    function startGame() {
      // 1. Remove a camada de entrada para revelar a tela do jogo
      const startScreen = document.getElementById('start-screen');
      startScreen.style.opacity = '0';
      startScreen.style.transition = 'opacity 0.3s ease';
      
      setTimeout(() => {
        startScreen.style.display = 'none';
      }, 300);

      // 2. Configura e dispara o EmulatorJS
      window.EJS_player = '#game-container';
      window.EJS_core = 'gb';
      window.EJS_gameUrl = 'Amarelin.gb';
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_color = '#facc15';

      // 3. Injeta o carregador do emulador
      var loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
    }
  </script>

</body>
</html>

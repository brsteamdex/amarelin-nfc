<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pokémon Yellow</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <script type="text/javascript">
    EJS_player = '#game-container';
    EJS_core = 'gb';
    
    // Nome exato da ROM (com A maiúsculo)
    EJS_gameUrl = 'Amarelin.gb';
    
    // Servidor seguro de assets do EmulatorJS
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    
    // Configurações otimizadas para Celular e PC
    EJS_startOnLoaded = false; // Exige um toque/clique para dar permissão de áudio no celular
    EJS_color = '#eab308';    // Cor temática do Pikachu
  </script>
  
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>

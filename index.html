<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pokémon Yellow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <script type="text/javascript">
    EJS_player = '#game-container';
    EJS_core = 'gb';
    EJS_gameUrl = 'Amarelin.gb';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    
    // Força o emulador a iniciar direto assim que baixar a ROM
    EJS_startOnLoaded = true;
    
    // Otimizações de layout e interface
    EJS_color = '#eab308';
    EJS_defaultFullscreen = false;
  </script>
  
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
